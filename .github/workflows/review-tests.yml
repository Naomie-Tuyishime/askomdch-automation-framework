name: Review Branch Manual Test
on:
  push:
    branches: [ "review" ]
  workflow_dispatch: # This adds the "Run" button

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Tests
        env:
          CI: "true"
        run: mvn clean test
